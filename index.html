function step(){const o=(a,k)=>a.map(x=>`<button class="op ${B[k]===x?"on":""}" data-k="${k}" data-v="${x}">${x}</button>`).join("");
let h=`<div class="st">${[0,1,2,3].map(i=>`<i class="${i<=B.s?"on":""}"></i>`).join("")}</div>`;
h+=B.s==0?`<h2>Choose a package or service</h2>${o([...D.rent.map(r=>r[0]+" · "+r[1]),...D.svc.map(s=>s[0]+" · "+s[2])],"svc")}`:B.s==1?`<h2>Pick a day and time</h2><div class="dg" style="margin:12px 0">${days.map(d=>`<button class="op ${B.day===d?"on":""}" data-k="day" data-v="${d}">${d.replace(/, /g,"<br>")}</button>`).join("")}</div>${o(["10:00 AM","12:00 PM","2:00 PM","4:00 PM"],"time")}`:B.s==2?`<h2>Your details</h2><input id="bn" placeholder="Name" value="${B.n}" aria-label="Name"><input id="be" type="email" placeholder="Email" value="${B.e}" aria-label="Email">`:`<h2>Review</h2><p style="margin:10px 0;color:#d8d1ec">${B.svc}<br>${B.day} at ${B.time}<br>${B.n}, ${B.e}</p><p style="color:var(--mu);font-size:13px">${NOTE}</p>`;
h+=`<div class="row" style="margin-top:14px">${B.s?`<button class="btn g" id="bb">Back</button>`:""}<button class="btn p" id="bx">${B.s==3?"Send request":"Continue"}</button></div>`;
$("#sh").innerHTML=h;$("#md").classList.add("o");
$("#sh").querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{B[b.dataset.k]=b.dataset.v;step()});
if($("#bb"))$("#bb").onclick=()=>{B.s--;step()};
$("#bx").onclick=()=>{if(B.s==2){B.n=$("#bn").value.trim();B.e=$("#be").value.trim();if(!B.n||!B.e)return alert("Add your name and email.")}
else if(B.s==0&&!B.svc||B.s==1&&!(B.day&&B.time))return alert("Pick an option to continue.");
if(B.s==3)return modal(`<h2>Request sent</h2><p style="color:var(--mu);margin-top:8px">This is a demo. Connect a booking service to confirm real dates.</p>`);B.s++;step()}}
/* motion */
const fb=$("#fb"),nv=$("#nv");
addEventListener("scroll",()=>{const y=scrollY,vh=innerHeight;nv.classList.toggle("s",y>30);fb.classList.toggle("on",y>vh*.5&&$("#end").getBoundingClientRect().top>vh*.7);
document.querySelectorAll(".glow").forEach(g=>g.style.transform=`translateY(${y*(+g.dataset.px)/100}px)`)},{passive:true});
document.addEventListener("pointermove",e=>{const m=e.target.closest(".mg");if(m&&e.pointerType==="mouse"){const r=m.getBoundingClientRect();m.style.transform=`translate(${(e.clientX-r.left-r.width/2)/9}px,${(e.clientY-r.top-r.height/2)/9}px)`}});
document.addEventListener("pointerout",e=>{const m=e.target.closest(".mg");if(m)m.style.transform=""});
setTab(0);
</script></body></html>
